/**:
  ros__parameters:
    global_frame: "camera_init"
    pose_frame: "aft_mapped"
    voxel_size: 0.1

    # explicitly disable depth camera
    use_depth: false
    # also color (for now)
    use_color: false


    # testing: try manually replacing things in base_link to the new aft_mapped
    workspace_height_bounds_visualization_attachment_frame_id: "aft_mapped"
    ground_plane_visualization_attachment_frame_id: "aft_mapped"

    # Lidar settings
    use_lidar: true
    lidar_width: 562
    lidar_height: 16 # approximate since our lidar uses a single beam
    lidar_min_valid_range_m: 0.05 # changed, based on docs
    use_non_equal_vertical_fov_lidar_params: true
    # crashes if exactly zero due to failed assertion, so make very small 
    min_angle_below_zero_elevation_rad: -0.001
    max_angle_above_zero_elevation_rad: 1.5708
    # testing: changed to false
    use_lidar_motion_compensation: false
    pointcloud2_timestamps_are_relative: true
    # QoS settings
    input_qos: "SENSOR_DATA"
    # Map clearing settings
    map_clearing_radius_m: 20.0 # no map clearing if < 0.0
    map_clearing_frame_id: "aft_mapped"
    # Rviz visualization
    esdf_slice_bounds_visualization_attachment_frame_id: "aft_mapped"

    # Increase visualization distance (due to lidar)
    layer_visualization_exclusion_radius_m: 20.0

    multi_mapper:
      connected_mask_component_size_threshold: 50

    static_mapper:
      # lidar integration
      # the unitree l2 supports up to 30m for reflective surfaces, but we'll keep 15 for now to be safe
      lidar_projective_integrator_max_integration_distance_m: 15.0
      projective_integrator_weighting_mode: "constant"
      raycast_subsampling_factor: 2
      # esdf integrator
      esdf_slice_height: -0.9
      esdf_slice_min_height: -0.9
      esdf_slice_max_height: 0.9
      # mesh streamer
      layer_streamer_exclusion_radius_m: 20.0

    dynamic_mapper:
      esdf_slice_height: -0.9
      esdf_slice_min_height: -0.9
      esdf_slice_max_height: 0.9
